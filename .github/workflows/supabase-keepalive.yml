# Supabase 無料プランの一時停止（7日間アクセスなし）を防ぐため、3日に1回メニューを読みに行く。
# 読み取りだけで、データは変更しない。使う鍵は公開してよい Publishable key のみ。
# 注意：リポジトリに60日間更新がないと GitHub がこの定期実行を止める（メールで通知が届き、再開できる）。
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 3 */3 * *' # 3日ごと 12:17（日本時間）
  workflow_dispatch: # Actions 画面から手動でも実行できる

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read menu from Supabase
        env:
          SUPABASE_URL: https://duoqdrwvkltdwivvcfnq.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_HVYIscHdSTt3YE1LN_S2OQ_bzKji4vQ
        run: |
          status=$(curl -sS -o body.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/menu_items?select=id&visible=is.true" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          count=$(grep -o '"id"' body.json | wc -l)
          echo "HTTP $status / 表示中の商品 $count 件"
          test "$status" = "200"
